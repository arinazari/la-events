# Deploy the dashboard to CLOUDFLARE Pages (Track A2 — the repo goes private, and GitHub
# Pages doesn't serve private repos on the free plan; Cloudflare Pages does).
#
# One home for the deploy step so the five workflows that publish (deploy-dashboard,
# refresh-events, build-profiles, spotify-sync, rebuild-profile) can't drift. Callers stage
# digests into dashboard/digests first (scripts/stage_digests.py or their inline copy) —
# this action just ships the dashboard/ directory as-is.
#
# Setup (once):
#   - Cloudflare dashboard -> My Profile -> API Tokens -> create token with
#     "Cloudflare Pages: Edit" on the account; add as repo Actions secret CLOUDFLARE_API_TOKEN.
#   - Add the account id (dash home, right sidebar) as secret CLOUDFLARE_ACCOUNT_ID.
#   - The Pages project is auto-created on the first deploy. If the default name is taken
#     on pages.dev, change `project` here AND the Worker's DATA_URL/ALLOWED_ORIGIN/PAGE_URL
#     (backend/wrangler.toml + DEFAULTS in concierge-worker.js) to match.
name: Deploy dashboard to Cloudflare Pages
description: Publish dashboard/ (incl. staged digests) to Cloudflare Pages via wrangler.

inputs:
  api-token:
    description: "CLOUDFLARE_API_TOKEN secret (Pages: Edit)"
    required: true
  account-id:
    description: "CLOUDFLARE_ACCOUNT_ID secret"
    required: true
  project:
    description: "Pages project name (site = https://<project>.pages.dev)"
    required: false
    default: "la-events"

runs:
  using: composite
  steps:
    - name: Deploy dashboard/ to Cloudflare Pages
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
        PROJECT: ${{ inputs.project }}
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets are not set — the dashboard was built but NOT published. See .github/actions/deploy-pages/action.yml for setup."
          exit 1
        fi
        # First-ever deploy: create the project (no-op/failure-tolerated when it already exists).
        npx --yes wrangler@3 pages project create "$PROJECT" --production-branch main 2>/dev/null || true
        # --commit-dirty: staged digests dirty the tree by design; --branch main = the production URL.
        npx --yes wrangler@3 pages deploy dashboard --project-name "$PROJECT" --branch main --commit-dirty=true
        echo "::notice::dashboard published -> https://$PROJECT.pages.dev"
