name: Land routine digests on main

# Scheduled Routines (the daily digest, the weekly Tuesday source-discovery) run in
# cloud sessions that push to an auto-assigned claude/* branch — they cannot push
# main directly, so their runs strand on side branches and the dashboard (deployed
# from main) goes stale. This closes that gap: when a claude/* branch tip is a
# routine "digest:" or "discover:" commit AND the branch is a pure extension of
# main, fast-forward main to it and kick the Pages deploy
# (a GITHUB_TOKEN push never fires push-triggered workflows, so the deploy must be
# dispatched explicitly; build-profiles isn't dispatched — the run already rebuilt
# every feed itself).
#
# Safety: fast-forward ONLY. If main is not an ancestor of the tip (branch based on
# a stale main, or any unrelated claude/* branch), the job skips with a notice and
# main is untouched — the next morning's run starts from current main and lands.
# Discover runs may only auto-commit what CLAUDE.md already allows unattended
# (Eventbrite organizer harvests, flaky/dead marks); new-source registrations stay
# proposals and must not ride in these commits.
# Mid-run checkpoint pushes (the routine commits in stages) may land too; each is a
# consistent committed snapshot, and the day's final push completes it.
#
# Note: push-triggered workflows run the file from the pushed branch, so this only
# fires for routine branches cloned AFTER it lands on main. For an already-stranded
# branch, run it by hand: Actions → this workflow → Run workflow → branch name.

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "claude/* branch to land on main (fast-forward only)"
        required: true

permissions:
  contents: write
  actions: write # dispatch the Pages deploy after the fast-forward

concurrency:
  group: land-digest
  cancel-in-progress: false

jobs:
  fast-forward:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'digest:') || startsWith(github.event.head_commit.message, 'discover:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full commit graph for the ancestry check
          filter: blob:none # ...but no blobs; the catalog history is heavy

      - name: Fast-forward main if the branch extends it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET="${{ github.event.inputs.branch || github.ref_name }}"
          git fetch --filter=blob:none origin main
          git fetch --filter=blob:none origin "refs/heads/${TARGET}"
          SHA=$(git rev-parse FETCH_HEAD)
          if ! git merge-base --is-ancestor origin/main "$SHA"; then
            echo "::notice::${TARGET} does not fast-forward from main — skipping (based on a stale main?)"
            exit 0
          fi
          git push origin "${SHA}:refs/heads/main"
          echo "::notice::main fast-forwarded to ${SHA} from ${TARGET}"
          gh workflow run deploy-dashboard.yml --ref main
