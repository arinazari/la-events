name: Rebuild one profile feed

# PER-USER action (the settings "Update my ranking & digest" button -> concierge Worker ->
# repository_dispatch "rebuild-profile" with the profile's public feed hash). Re-runs the FULL LLM
# pass for THIS profile against the current catalog: event-editor verdicts + scene enrichment +
# the personalized narrative digest (routines/profile-digest-prompt.md, run by Claude Code), then
# commits + redeploys. Keyed by hash because the dashboard only knows the hash, not the username.
#
# Needs ANTHROPIC_API_KEY (the agent) in repo secrets. Optional SPOTIFY_SYNC_* keep the music layer
# intact (synced before the rebuild so a single-profile build doesn't clobber it back to taste-only).
# If ANTHROPIC_API_KEY is unset the agent step fails loudly — set it, or fall back to the nightly
# routine for the LLM pass.
on:
  repository_dispatch:
    types: [rebuild-profile]
  workflow_dispatch:
    inputs:
      hash:
        description: "Profile feed hash to rebuild"
        required: true
      model:
        description: "LLM for the editor+enrichment+digest pass: sonnet (default) or opus (when it matters)"
        required: false
        default: sonnet

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # build_profiles bakes a git diff + reflected/pending flag into the feed;
                              # needs real history. Also lets the final step rebuild the feed against the
                              # just-committed enrichment so it bakes "reflected" immediately.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pyyaml

      - name: Resolve the target hash
        id: target
        env:
          HASH: ${{ github.event.client_payload.profile || github.event.inputs.hash }}
        run: |
          if ! echo "$HASH" | grep -Eq '^[0-9a-f]{8,32}$'; then
            echo "Invalid or missing profile hash: '$HASH'" >&2
            exit 1
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          # Is this the owner? The owner's displayed digest is the consolidated digests/latest.md
          # (stage_digests publishes that for owner), so the owner's Update must re-render THAT.
          # ($HASH is validated hex above, so it's safe to interpolate into the one-liner.)
          owner="$(python -c "import hashlib,yaml; m=yaml.safe_load(open('profiles.yaml')) or {}; s=m.get('salt') or 'la-events/v1:'; print('true' if any(p.get('owner') and hashlib.sha256((s+p['username'].strip().lower()).encode()).hexdigest()[:16]=='$HASH' for p in (m.get('profiles') or []) if p.get('username')) else 'false')")"
          echo "is_owner=${owner:-false}" >> "$GITHUB_OUTPUT"
          # Model for the LLM pass: sonnet by default (Q3), 'opus' when it matters (or an explicit
          # claude-* id). repository_dispatch may carry client_payload.model; the manual run takes the input.
          MODEL="${{ github.event.client_payload.model || github.event.inputs.model }}"
          case "$MODEL" in
            opus) MODEL="claude-opus-4-8" ;;
            claude-*) : ;;
            *) MODEL="claude-sonnet-4-6" ;;
          esac
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"

      # Keep the per-profile music layer intact: sync connected Spotify into data/spotify/<hash>.json
      # (gitignored) BEFORE the rebuild, so a single-profile build doesn't drop it to taste-only.
      # SKIPs cleanly if the Worker sync isn't configured.
      - name: Sync this profile's Spotify (best-effort)
        continue-on-error: true
        env:
          SPOTIFY_SYNC_URL: ${{ secrets.SPOTIFY_SYNC_URL }}
          SPOTIFY_SYNC_TOKEN: ${{ secrets.SPOTIFY_SYNC_TOKEN }}
        run: python scripts/sync_profiles_spotify.py

      # Deterministic feed FIRST, and COMMIT IT IMMEDIATELY — while git is still clean (before the
      # claude-code-action rewrites the remote / makes its own local commits). This durably lands the
      # ranking (taste + Spotify + existing verdicts) + the catalog_version stamp on main, so the
      # dashboard's "Update" button syncs even if the LLM step below times out or its git is hijacked.
      - name: Re-score this profile's feed (deterministic) + commit
        env:
          HASH: ${{ steps.target.outputs.hash }}
          IS_OWNER: ${{ steps.target.outputs.is_owner }}
        run: |
          paths="dashboard/data.$HASH.json dashboard/catalog_meta.json"
          # Owner = the canonical/default feed, and their displayed digest IS the consolidated one.
          # Re-render it deterministically (same path refresh-events/nightly use) so the owner's
          # Update visibly refreshes the digest, not just the feed. Best-effort — and BEFORE the
          # feed build: build_profiles lifts "The Take" (front_page.take) from digests/latest.md,
          # so the feed must read the doc this run deploys (fresh scaffold -> take null until the
          # nightly voice pass), not carry yesterday's intro over a digest that no longer has it.
          if [ "$IS_OWNER" = "true" ]; then
            python scripts/build_radar.py || true
            python scripts/render_digest.py --consolidated \
              --md digests/latest.md || true
            paths="$paths digests/latest.md"
          fi
          python scripts/build_profiles.py --only-hash "$HASH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- $paths 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No feed/digest change for $HASH."
          else
            git commit -m "rebuild: re-rank profile $HASH against latest catalog [skip ci]"
            git push origin HEAD:main
          fi

      # LLM pass: fresh event-editor verdicts + scene enrichment + the narrative digest. Bounded by
      # the prompt (top-N only) so it finishes within turns; best-effort. Auto-discovers .claude/agents/.
      #
      # timeout-minutes is the WALL-CLOCK bound --max-turns can't provide (one Task batch = one turn,
      # however long it runs): a drift-flooded verdict cache once pushed this step to 27m40s and the
      # dashboard's Update button ticked "re-ranking" to the edge of its 30-min poll cap. The kill is
      # safe by design — the deterministic feed is already committed above, whatever the agent left in
      # the working tree (merged verdict batches, enrichment) is committed by the receipt step below,
      # and the receipt + deploy are what the page is actually waiting on. Click → receipt ≤ ~13 min.
      - name: LLM editor + enrichment + digest (best-effort)
        continue-on-error: true
        timeout-minutes: 10
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Execute routines/profile-digest-prompt.md exactly, for the single profile whose dashboard
            feed hash is ${{ steps.target.outputs.hash }}. Wherever the file says <HASH>, use that hash.
            The deterministic feed has already been built + committed — focus on the LLM layer + digest,
            and stay within the per-step caps in that file so you finish. Do NOT git commit or push —
            leave every changed file in the working tree; the workflow commits and deploys after you finish.
          claude_args: |
            --max-turns 80
            --model ${{ steps.target.outputs.model }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash,Task,WebSearch,WebFetch"

      # Best-effort: durably commit the LLM digest + verdicts (warm cache => cheaper next click), and
      # ALWAYS stamp dashboard/rebuilt.<hash>.json — the completion receipt the dashboard's Update
      # poll watches. Without the receipt, a run whose LLM pass leaves the digest byte-identical
      # (nothing new to judge) is invisible to the page and the button spins to its 30-min cap.
      # The action hijacks git (claude[bot], rewrites origin, its own local commit), so don't fight it
      # in place — copy the artifacts aside, hard-reset to the feed commit we already pushed (clean,
      # conflict-proof), drop them back, and push. If this can't land, the receipt + digest still
      # deploy live below (this run's Pages artifact carries them) — the feed is already durably on
      # main regardless, and the nightly routine persists the rest.
      - name: Commit the LLM artifacts + rebuild receipt (best-effort)
        continue-on-error: true
        env:
          HASH: ${{ steps.target.outputs.hash }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp="$(mktemp -d)"
          [ -f "digests/$HASH/latest.md" ] && cp "digests/$HASH/latest.md" "$tmp/digest.md" || true
          [ -f "data/verdicts/$HASH.json" ] && cp "data/verdicts/$HASH.json" "$tmp/verdicts.json" || true
          # The OWNER's verdicts merge into the default store (merge_verdicts resolves their feed
          # hash -> default.json), so carry it too — for friends it's untouched and stages nothing.
          [ -f data/verdicts/default.json ] && cp data/verdicts/default.json "$tmp/verdicts-default.json" || true
          [ -f data/enrichment.json ] && cp data/enrichment.json "$tmp/enrichment.json" || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main -q || true
          git reset --hard origin/main -q || true     # clean tree on the feed commit pushed above
          [ -f "$tmp/digest.md" ] && mkdir -p "digests/$HASH" && cp "$tmp/digest.md" "digests/$HASH/latest.md" || true
          [ -f "$tmp/verdicts.json" ] && mkdir -p data/verdicts && cp "$tmp/verdicts.json" "data/verdicts/$HASH.json" || true
          [ -f "$tmp/verdicts-default.json" ] && mkdir -p data/verdicts && cp "$tmp/verdicts-default.json" data/verdicts/default.json || true
          [ -f "$tmp/enrichment.json" ] && cp "$tmp/enrichment.json" data/enrichment.json || true
          printf '{"rebuilt_at":"%s","run_id":"%s"}\n' "$(date -u +%FT%TZ)" "$GITHUB_RUN_ID" > "dashboard/rebuilt.$HASH.json"
          # One add per path: a single multi-path `git add` stages NOTHING if any pathspec is
          # missing (new profile with no digest/verdicts yet), silently dropping the rest.
          for f in "data/verdicts/$HASH.json" data/verdicts/default.json data/enrichment.json "digests/$HASH/latest.md" "dashboard/rebuilt.$HASH.json"; do
            [ -f "$f" ] && git add -- "$f" || true
          done
          # The receipt is unique per run, so this commit always lands — that's the point: the
          # page needs a completion signal even when the LLM pass produced nothing new.
          git commit -m "rebuild: LLM artifacts + receipt for profile $HASH [skip ci]"
          # The fresh enrichment is now in HEAD. Rebuild this feed once more so its baked
          # self_edit diff/reflected flag sees it (otherwise the feed would keep showing
          # the user's last edit as "pending" until the next nightly build). Fold the
          # corrected feed into the same commit; best-effort so it never blocks the push.
          if python scripts/build_profiles.py --only-hash "$HASH"; then
            git add -- "dashboard/data.$HASH.json" 2>/dev/null || true
            git diff --cached --quiet || git commit --amend --no-edit
          fi
          git push origin HEAD:main || echo "push skipped (this run's deploy still ships the receipt; nightly persists the rest)"

      - uses: actions/configure-pages@v5
      - name: Stage digests for the dashboard
        run: python3 scripts/stage_digests.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
