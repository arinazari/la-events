name: Deploy dashboard to GitHub Pages

# Publishes the static dashboard/ folder (incl. its committed data.json) to Pages.
# No build step — the feed is generated by scripts/build_dashboard.py and committed.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The dashboard's "digest ↗" popup reads ./digests/latest.md. Stage the newest dated
      # digest into the published artifact (keeps build_dashboard.py / the repo untouched).
      - name: Stage latest digest for the dashboard
        run: |
          mkdir -p dashboard/digests
          latest="$(ls -1 digests/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].md 2>/dev/null | sort | tail -n1)"
          if [ -n "$latest" ]; then
            cp "$latest" dashboard/digests/latest.md
            echo "Staged $latest -> dashboard/digests/latest.md"
          else
            echo "No dated digest found; the popup falls back to its bundled sample."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
