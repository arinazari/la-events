name: Deploy dashboard to GitHub Pages

# Publishes the static dashboard/ folder (incl. its committed data.json) to Pages.
# No build step — the feed is generated by scripts/build_dashboard.py and committed.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The dashboard reads ./digests/latest.md (default) and ./digests/<hash>/latest.md (per
      # logged-in profile). stage_digests.py copies the newest dated digest to latest.md AND, for
      # owner:true profiles, into their hash dir — so the owner's login shows the canonical digest
      # instead of "regenerate" (friends with their own digest: dir are staged too). The repo's
      # digests/ stays untouched; stdlib-only, no extra deps.
      - name: Stage digests for the dashboard
        run: python3 scripts/stage_digests.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
