name: Deploy dashboard to Cloudflare Pages

# Publishes the static dashboard/ folder (incl. its committed data.json) to Cloudflare Pages
# (Track A2: the repo is going private, and free GitHub Pages can't serve a private repo —
# Cloudflare Pages can). No build step — the feed is generated by scripts/build_dashboard.py
# and committed. The deploy itself lives in .github/actions/deploy-pages (one home, five callers).
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
      - ".github/actions/deploy-pages/**"
  workflow_dispatch:

permissions:
  contents: read

# One concurrent deploy; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Publish the TIP of main, not the commit that triggered this run. Every Pages deploy shares the
      # `pages` concurrency group (cancel-in-progress: false), so a push-triggered deploy can sit queued
      # behind a rebuild-profile run and only start AFTER it. Checking out the triggering SHA would then
      # re-publish that older snapshot and silently drop a per-profile digest the rebuild just committed
      # (exactly how Taylor's digest got committed to main yet 404'd live). ref:main = always newest.
      - uses: actions/checkout@v4
        with:
          ref: main
      # The dashboard reads ./digests/latest.md (default) and ./digests/<hash>/latest.md (per
      # logged-in profile). stage_digests.py stages the consolidated daily digest (digests/latest.md,
      # falling back to the newest dated) to latest.md AND, for owner:true profiles, into their hash
      # dir — so the owner's login shows the canonical digest instead of "regenerate" (friends with
      # their own digest: dir are staged too). The repo's digests/ stays untouched; stdlib-only.
      - name: Stage digests for the dashboard
        run: python3 scripts/stage_digests.py
      - uses: ./.github/actions/deploy-pages
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
