name: Refresh events database

# ADMIN action + nightly deterministic fallback. Triggers:
#   - schedule (cron): a DETERMINISTIC nightly catalog floor so the dashboard's "last data pull"
#     stays fresh even when the full LLM Routine (claude.ai Routines) fails to land a run. No LLM here.
#   - repository_dispatch: the owner's "Refresh events database" button -> concierge Worker.
#   - workflow_dispatch: manual.
# Re-fetches every source, rebuilds the deduped catalog, and republishes the catalog version stamp
# + the default/logged-out feed. This is the deterministic core of the daily routine, on demand —
# it does NOT run the LLM enrichment/editor passes and does NOT rebuild per-profile feeds: each
# logged-in user then sees their ranking flagged stale and clicks their own "Update" button
# (the rebuild-profile workflow). The nightly routine still does the full LLM pass for everyone.
#
# Source secrets are optional — run_digest degrades gracefully when one is missing (that source is
# just skipped), so the refresh works with whatever is configured:
#   TM_API_KEY  POSH_TOKEN  SPOTIFY_CLIENT_ID  SPOTIFY_CLIENT_SECRET  SPOTIFY_REFRESH_TOKEN
on:
  schedule:
    # 10:00 UTC ≈ 3am PT. A FALLBACK for the nightly LLM Routine, not a second nightly: the gate
    # job below skips this run if the catalog was already refreshed today (Routine or manual), so
    # the deterministic render never clobbers the Routine's richer LLM digest. It only does work
    # when the Routine didn't land — keeping the catalog (and the "last data pull" stamp) fresh.
    # NB: GitHub only runs scheduled workflows from the DEFAULT branch, so this activates once
    # merged to main. Set the cron a couple hours after the Routine's slot for the cleanest handoff.
    - cron: "0 10 * * *"
  repository_dispatch:
    types: [refresh-events]
  workflow_dispatch:

permissions:
  contents: write      # commit the refreshed catalog + feed
  pages: write
  id-token: write

# Share the Pages concurrency group with the other feed workflows so deploys don't race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A scheduled run is a fallback for the nightly LLM Routine: gate it on catalog freshness so it
  # only does work (and only re-renders digests/latest) when the Routine didn't land. Manual and
  # button runs (workflow_dispatch / repository_dispatch) always proceed.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to run (scheduled run skips if the catalog is already fresh)
        id: decide
        env:
          STALE_AFTER_HOURS: "20"   # skip a scheduled run if the catalog was refreshed within this window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual/dispatch trigger → always run."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif python3 scripts/catalog_age.py --stale-after "$STALE_AFTER_HOURS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - name: Fetch all sources -> rebuild catalog + catalog_meta
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
          POSH_TOKEN: ${{ secrets.POSH_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python scripts/run_digest.py

      - name: Rebuild the default (logged-out) feed + publish catalog_meta
        run: python scripts/build_dashboard.py

      - name: Re-render the default consolidated digest (best-effort)
        continue-on-error: true
        run: |
          python scripts/build_radar.py || true
          python scripts/render_digest.py --consolidated \
            --md digests/latest.md --html digests/latest.html \
            --asset-prefix "./" || true

      - name: Commit the refreshed catalog + feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/catalog.json data/catalog_meta.json \
            dashboard/data.json dashboard/catalog_meta.json \
            digests/latest.md digests/latest.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes after refresh."
          else
            git commit -m "refresh: rebuild events catalog from sources [skip ci]"
            git push
          fi

      # Deploy the refreshed dashboard/ to Pages (the [skip ci] commit won't trigger deploy-dashboard).
      - uses: actions/configure-pages@v5
      - name: Stage digests for the dashboard
        run: python3 scripts/stage_digests.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
