<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LA Events — Concierge</title>
  <meta name="description" content="Search, plan, and tune your taste-ranked LA events concierge." />
  <meta name="theme-color" content="#0d0e14" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="site">
    <div class="site-inner">
      <div class="brand">
        <h1>LA Events</h1>
        <span class="tag">your scene concierge</span>
      </div>
      <nav class="tabs" id="tabs" role="tablist">
        <button class="tab active" data-view="explore" role="tab">Explore</button>
        <button class="tab" data-view="plan" role="tab">Plan</button>
        <button class="tab" data-view="settings" role="tab">Settings</button>
      </nav>
      <div class="meta" id="meta"><span id="generated"></span></div>
    </div>
  </header>

  <main class="wrap">
    <section id="view-explore" class="view active" role="tabpanel"></section>
    <section id="view-plan" class="view" role="tabpanel"></section>
    <section id="view-settings" class="view" role="tabpanel"></section>
  </main>

  <footer class="site">
    <div class="wrap" id="footer-note">
      Data from <code>data.json</code>, generated by <code>scripts/build_dashboard.py</code> from the catalog +
      taste profile. The catalog refreshes on a daily routine. Ratings are a taste estimate — tap “why?” on a
      card to see the math.
    </div>
  </footer>

  <script type="module" src="./js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
