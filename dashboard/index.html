<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LA Events — Dashboard</title>
  <meta name="description" content="Filterable dashboard of LA events, ranked for you." />
  <meta name="theme-color" content="#0d0e14" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="site">
    <div class="site-inner">
      <div class="brand">
        <h1>LA Events</h1>
        <span class="tag">explore &amp; filter · ranked for you</span>
      </div>
      <div class="meta" id="meta"><span id="generated"></span></div>
    </div>
  </header>

  <main class="wrap">
    <section class="controls">
      <div class="search-row">
        <div class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path>
          </svg>
          <input id="q" type="search" placeholder="Search title, venue, artist, neighborhood…" autocomplete="off" />
        </div>
      </div>

      <div class="field" style="margin-bottom:16px">
        <label>Type</label>
        <div class="pills" id="cat-pills"></div>
      </div>

      <div class="filters">
        <div class="field">
          <label for="hood">Location</label>
          <select id="hood"><option value="">All neighborhoods</option></select>
        </div>
        <div class="field">
          <label for="from">From date</label>
          <input id="from" type="date" />
        </div>
        <div class="field">
          <label for="to">To date</label>
          <input id="to" type="date" />
        </div>
        <div class="field">
          <label>Recommended rating</label>
          <div class="rating-filter" id="rating-filter"></div>
        </div>
      </div>
    </section>

    <div class="toolbar">
      <div class="count" id="count"></div>
      <div class="toolbar-right">
        <label style="color:var(--text-dim);font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer">
          <input id="hide-past" type="checkbox" checked /> Hide past
        </label>
        <button class="sort-toggle" id="sort">Sort: Date ↑</button>
        <button class="reset" id="reset">Reset</button>
      </div>
    </div>

    <div class="grid" id="grid"></div>
  </main>

  <footer class="site">
    <div class="wrap">
      Data from <code>data.json</code>, generated by <code>scripts/build_dashboard.py</code> from the catalog + taste.yaml.
      Re-run it after each digest to refresh. Ratings are a taste estimate — tap “why?” on a card to see the math.
    </div>
  </footer>

  <script src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
