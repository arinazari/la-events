# Festival & big-event radar — the "coming up" watch-list.
# This file is the standing memory; the digest's "On the radar" section is RELEVANCE-GATED:
# only surface an item when there's a real ticket deadline (on-sale/presale opening, prices
# climbing, low stock, selling out, sold out, or a lineup just dropped). Items marked
# status: dormant / annual_watch stay here and do NOT go in the digest until they're timely.
# NOTE: this file is now machine-consumed — scripts/build_radar.py folds active entries into
# data/radar.json each run, so curated out-of-market festivals (Outside Lands, Portola, Coachella…)
# render even on an unattended routine. The `status` field is the gate: dormant/annual_watch/past
# are held; any other status with a future `when` surfaces. The live web lookup refines on top.
# Keep it taste-aligned (house/techno/European/groove + a few must-knows). Refresh status with
# a quick live web lookup per run. Last refreshed: 2026-06-16
#
# Fields:
#   name, location, when (dates or typical window), status (announced|on_sale|lineup_pending|
#   past|annual_watch), tickets (url), why (one-line, taste-relevant), refresh (what to web-check)
# Keep it tight and taste-aligned (house/techno/European/groove lean + a few must-knows).
# Last refreshed: 2026-06-16

festivals:
  - name: Outside Lands 2026
    location: Golden Gate Park, San Francisco
    when: 2026-08-07..09
    status: on_sale
    tickets: https://www.sfoutsidelands.com/
    why: >
      Rüfüs Du Sol + The xx headline the on-taste end; Charli xcx, The Strokes, Turnstile,
      Empire of the Sun broaden it. ~2 months out, travel weekend. 3-day GA from ~$569.
    refresh: confirm single-day availability + any electronic-stage adds

  - name: Portola 2026
    location: Pier 80, San Francisco
    when: 2026-09-26..27
    status: on_sale
    tickets: https://www.portolamusicfestival.com/
    why: >
      THE one for you — electronic-forward with DESPACIO (James Murphy + 2ManyDJs sound system),
      Four Tet, Soulwax, Groove Armada, DJ Shadow, Fatboy Slim, Skepta, plus Robyn, Tiësto,
      Swedish House Mafia. European/house energy in a warehouse-pier setting. 2-day ~$380.
    refresh: set times / DESPACIO schedule, single-day availability

  - name: CRSSD Festival — Fall 2026
    location: Waterfront Park, San Diego
    when: 2026-09-26..27
    status: on_sale
    tickets: https://www.crssdfest.com/
    why: >
      SD is a drive, but this is festival-tier and on-taste — Disclosure, Chris Lake, Groove
      Armada (DJ set), Helena Hauff, Ben UFO, I Hate Models, Mathame, Carlita, salute. House/
      techno/melodic, European lean, waterfront, 21+. NOTE: same weekend as Portola (SF) —
      can't do both; pick one.
    refresh: single-day availability + set times; resolve the Portola clash

  - name: Coachella 2027
    location: Empire Polo Club, Indio CA
    when: 2027-04-09..11 and 2027-04-16..18
    status: lineup_pending
    tickets: https://www.coachella.com/
    why: >
      Advance GA already sold out (~$549–599); lineup typically drops Sept 2026–Jan 2027.
      Worth tracking the lineup announce to decide if a resale is worth it.
    refresh: lineup announcement date + any resale/waitlist

  - name: GALA Festival (London) — 2027 edition
    location: Peckham Rye Park, South London
    when: ~2027-05 (annual, late May; 2026 already happened May 22–24)
    status: dormant   # ~11 months out, no tickets yet — do NOT surface in digest until ~Jan 2027
    tickets: https://galafestival.co.uk
    why: >
      Quintessential European house/disco day-fest (2026: Seth Troxler, Todd Terje, Call Super,
      DJ Seinfeld). On-taste, but not timely — only bubble up when 2027 presale/lineup drops.
    refresh: 2027 dates + lineup announce (usually Jan–Feb); presale registration

  - name: Daisy Chain Fields (Olivia Rodrigo)
    location: Great Park Live, Irvine (OC — ~45 mi, worth the drive)
    when: 2026-08-29
    status: announced   # general on-sale Wed 6/24 10am PT — timely NOW
    tickets: https://www.daisychainfields.com/tickets
    why: >
      Olivia Rodrigo's first festival — a one-day, all-women lineup (Chappell Roan, Doechii,
      Mitski, The Breeders, Bikini Kill, Garbage, Santigold + special guests Stevie Nicks, Karen O,
      Sarah McLachlan), 100% of net proceeds to women/girls nonprofits. Off the core house/techno
      lane, but a marquee must-know — and squarely on-taste for the Lori profile (she tracks Olivia
      Rodrigo + Mitski). Tickets via Front Gate; from $250.
    refresh: confirm the 6/24 on-sale held; watch single-day sellout + price-tier climbs

big_concerts:
  # seed sparingly with travel-worthy / must-know shows; the digest also pulls far-dated
  # Goldenvoice/TM entries + does a live web check for on-taste tours hitting LA.
  - name: (auto-populated each run)
    note: >
      During the radar refresh, web-check for on-taste artists announcing LA dates (e.g. Four Tet,
      Bicep, Floating Points, Jamie xx, Bonobo, Caribou, Overmono, Peggy Gou, Bradley Zero/Rhythm
      Section) and surface anything 1–6 months out with on-sale info.
