# LA Events — Source Registry
# ---------------------------------------------------------------------------
# Schema per source:
#   name:      display name
#   category:  electronic | live_music | comedy | film | theater | editorial |
#              general | beer_food | multi
#   method:    api | graphql | jsonld | scrape | rss | ics | gmail | manual
#   url:       endpoint or calendar page (or IG handle for manual)
#   priority:  1 (always fetch) .. 3 (only on category-specific requests)
#   status:    active | candidate | manual | flaky | dead
#   notes:     anything operationally useful
#
# last_discovery: updated whenever Discover mode runs
# ---------------------------------------------------------------------------

last_discovery: null

sources:

  # ── Tier 1: structured pipelines ─────────────────────────────────────────
  - name: Ticketmaster Discovery API
    category: multi
    method: api
    url: https://app.ticketmaster.com/discovery/v2/events.json
    priority: 1
    status: active
    notes: >
      Free key, 5000 calls/day. dmaId=324 for LA. Covers TM, TicketWeb, Universe,
      FrontGate — incl. Pantages (Broadway in Hollywood). Use scripts/fetch_ticketmaster.py.

  - name: Resident Advisor (LA)
    category: electronic
    method: graphql
    url: https://ra.co/graphql
    priority: 1
    status: active
    notes: >
      Unofficial GraphQL. scripts/fetch_ra.py. Verify AREA_ID once (see script header).
      Late start times = afterhours flags. Catches most semi-public warehouse events.

  - name: DICE (LA)
    category: electronic
    method: jsonld
    url: https://dice.fm/browse/los-angeles
    priority: 1
    status: active
    notes: >
      No public API. Event pages embed schema.org JSON-LD. Heavy eastside/indie-club
      coverage; overlaps RA — dedupe expected.

  - name: Gmail "Events" label
    category: multi
    method: gmail
    url: label:Events
    priority: 1
    status: active
    notes: >
      Promoter blasts, venue newsletters, SMS forwards. The afterhours backbone.
      User action: sign up for promoter lists, filter to this label.

  # ── Tier 2: editorial / curation signals (ranking boosts, not catalog) ──
  - name: LAist — Best Things To Do
    category: editorial
    method: scrape
    url: https://laist.com/news/la-history/best-things-to-do-los-angeles
    priority: 1
    status: active
    notes: Weekly roundup; URL pattern varies — search site if stale.

  - name: Time Out Los Angeles
    category: editorial
    method: scrape
    url: https://www.timeout.com/los-angeles/things-to-do/things-to-do-in-los-angeles-this-weekend
    priority: 1
    status: active

  - name: We Like LA
    category: editorial
    method: rss
    url: https://www.welikela.com/feed/
    priority: 2
    status: active

  - name: Secret Los Angeles
    category: editorial
    method: scrape
    url: https://secretlosangeles.com/things-to-do/
    priority: 2
    status: active
    notes: Site, not the IG. IG account is manual-capture only.

  - name: LA Times — Things to Do
    category: editorial
    method: scrape
    url: https://www.latimes.com/entertainment-arts/things-to-do
    priority: 2
    status: active
    notes: Possible paywall friction; degrade gracefully.

  - name: 6AM Group — weekly LA picks
    category: electronic
    method: scrape
    url: https://www.6amgroup.com/
    priority: 1
    status: active
    notes: Techno/underground editorial + their own events. Also has newsletter → Gmail.

  - name: Dirty Epic — weekly picks
    category: electronic
    method: scrape
    url: https://dirtyepic.com/
    priority: 2
    status: active
    notes: Underground techno editorial. Newsletter available → Gmail label.

  - name: Restless Nites
    category: electronic
    method: scrape
    url: https://www.restlessnites.com/
    priority: 2
    status: candidate
    notes: Eastside-leaning nightlife calendar. Verify current activity on first run.

  # ── Tier 3: venues & promoters (JSON-LD / scrape) ────────────────────────
  - name: Goldenvoice
    category: live_music
    method: scrape
    url: https://www.goldenvoice.com/events/
    priority: 1
    status: active
    notes: AXS venues (Fonda, El Rey, Shrine, Novo...). AXS has no public API; scrape GV directly.

  - name: Eventbrite (LA browse)
    category: multi
    method: jsonld
    url: https://www.eventbrite.com/d/ca--los-angeles/events/
    priority: 2
    status: active
    notes: Public event-search API was retired; use browse pages + JSON-LD. High noise — filter hard.

  - name: Hollywood Pantages / Broadway in Hollywood
