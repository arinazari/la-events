  # ── Discovered 2026-06-16 (user-proposed) ───────────────────────────────
  - name: Subtract Music
    category: electronic
    method: manual
    url: https://subtractmusic.com/
    priority: 2
    status: candidate
    notes: >
      LA techno promoter/collective. Site is a JS-rendered SPA — no static events to scrape
      (verified 2026-06-16). Their parties almost certainly surface on RA/19hz already; best
      path is to treat as a promoter signal (boost RA/19hz events organized by them) and join
      their list → Gmail "Events" label. Not a standalone fetch target.

  - name: Discover Los Angeles
    category: editorial
    method: scrape
    url: https://www.discoverlosangeles.com/events
    priority: 3
    status: candidate
    notes: >
      Official LA tourism board calendar — broad/touristy, useful as an editorial boost signal.
      Bot-protected: all event paths 403 to plain curl (verified 2026-06-16). Needs a headless
      render or their ICS/API if one exists. Low priority vs. taste-aligned sources.

  # ── Verified-this-session reality check (2026-06-16) ─────────────────────
  # Static JSON-LD scraping (scripts/fetch_jsonld.py) covers FAR fewer LA sources than the
  # registry's method:jsonld tags assumed. Confirmed returning 0 events via static fetch:
  # DICE, Lodge Room, Pantages/Broadway-in-Hollywood, Vidiots (Filmbot), Zebulon, 2220 Arts.
  # These are JS-rendered and need either each site's underlying API or a headless-render
  # helper (proposed Phase-2 work). fetch_jsonld.py itself is correct and works on any source
  # that serves Event JSON-LD server-side; it just has few current targets. 19hz (table parser)
  # and the RA/TM APIs remain the reliable structured backbone.
