  # ── Verified-this-session reality check (2026-06-16) ─────────────────────
  # Static JSON-LD scraping (scripts/fetch_jsonld.py) covers FAR fewer LA sources than the
  # registry's method:jsonld tags assumed. Confirmed returning 0 events via static fetch:
  # DICE, Lodge Room, Pantages/Broadway-in-Hollywood, Vidiots (Filmbot), Zebulon, 2220 Arts.
  # These are JS-rendered and need either each site's underlying API or a headless-render
  # helper (proposed Phase-2 work). fetch_jsonld.py itself is correct and works on any source
  # that serves Event JSON-LD server-side; it just has few current targets. 19hz (table parser)
  # and the RA/TM APIs remain the reliable structured backbone.
