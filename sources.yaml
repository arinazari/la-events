# LA Events — Source Registry
# ---------------------------------------------------------------------------
# Schema per source:
#   name:      display name
#   category:  electronic | live_music | comedy | film | theater | editorial |
#              general | beer_food | multi
#   method:    api | graphql | jsonld | scrape | rss | ics | gmail | manual
#   url:       endpoint or calendar page (or IG handle for manual)
#   priority:  1 (always fetch) .. 3 (only on category-specific requests)
#   status:    active | candidate | manual | flaky | dead
#   notes:     anything operationally useful
#
# last_discovery: updated whenever Discover mode runs
# ---------------------------------------------------------------------------

last_discovery: 2026-06-16

sources:

  # ── Tier 1: structured pipelines ─────────────────────────────────────────
  - name: Ticketmaster Discovery API
    category: multi
    method: api
    url: https://app.ticketmaster.com/discovery/v2/events.json
    priority: 1
    status: active
    notes: >
      Free key, 5000 calls/day. dmaId=324 for LA. Covers TM, TicketWeb, Universe,
      FrontGate — incl. Pantages (Broadway in Hollywood). Use scripts/fetch_ticketmaster.py.

  - name: Resident Advisor (LA)
    category: electronic
    method: graphql
    url: https://ra.co/graphql
    priority: 1
    status: active
    notes: >
      Unofficial GraphQL. scripts/fetch_ra.py. Verify AREA_ID once (see script header).
      Late start times = afterhours flags. Catches most semi-public warehouse events.

  - name: 19hz (LA)
    category: electronic
    method: scrape
    url: https://19hz.info/eventlisting_LosAngeles.php
    priority: 1
    status: active
    notes: >
      Canonical grassroots LA dance calendar (clubs, warehouses, festivals). HTML tables,
      no JSON-LD. scripts/fetch_19hz.py. Verified 2026-06-16: ~200 events/2wk, ~half flagged
      afterhours, with price tiers (incl. early-bird) and organizer/promoter names — the
      organizer column is a goldmine for Discover mode. Best single electronic source.

  - name: DICE (LA)
    category: electronic
    method: jsonld
    url: https://dice.fm/browse/los-angeles
    priority: 1
    status: flaky
    notes: >
      Browse page is JS-rendered — no schema.org/Event in static HTML (verified 2026-06-16,
      generic JSON-LD scraper returns 0). Event JSON-LD may live on individual /event/ detail
      pages; needs a crawl-then-parse step or a headless render. Heavy eastside/indie overlap
      with RA when it works.

  - name: Gmail "Events" label
    category: multi
    method: gmail
    url: label:Events
    priority: 1
    status: active
    notes: >
      Promoter blasts, venue newsletters, SMS forwards. The afterhours backbone.
      User action: sign up for promoter lists, filter to this label.

  # ── Tier 2: editorial / curation signals (ranking boosts, not catalog) ──
  - name: LAist — Best Things To Do
    category: editorial
    method: scrape
    url: https://laist.com/news/la-history/best-things-to-do-los-angeles
    priority: 1
    status: active
    notes: Weekly roundup; URL pattern varies — search site if stale.

  - name: Time Out Los Angeles
    category: editorial
    method: scrape
    url: https://www.timeout.com/los-angeles/things-to-do/things-to-do-in-los-angeles-this-weekend
    priority: 1
    status: active

  - name: We Like LA
    category: editorial
    method: rss
    url: https://www.welikela.com/feed/
    priority: 2
    status: active

  - name: Secret Los Angeles
    category: editorial
    method: scrape
    url: https://secretlosangeles.com/things-to-do/
    priority: 2
    status: active
    notes: Site, not the IG. IG account is manual-capture only.

  - name: LA Times — Things to Do
    category: editorial
    method: scrape
    url: https://www.latimes.com/entertainment-arts/things-to-do
    priority: 2
    status: active
    notes: Possible paywall friction; degrade gracefully.

  - name: 6AM Group — weekly LA picks
    category: electronic
    method: scrape
    url: https://www.6amgroup.com/
    priority: 1
    status: active
    notes: Techno/underground editorial + their own events. Also has newsletter → Gmail.

  - name: Dirty Epic — weekly picks
    category: electronic
    method: scrape
    url: https://dirtyepic.com/
    priority: 2
    status: active
    notes: Underground techno editorial. Newsletter available → Gmail label.

  - name: Restless Nites
    category: electronic
    method: scrape
    url: https://www.restlessnites.com/
    priority: 2
    status: candidate
    notes: Eastside-leaning nightlife calendar. Verify current activity on first run.

  # ── Tier 3: venues & promoters (JSON-LD / scrape) ────────────────────────
  - name: Goldenvoice
    category: live_music
    method: scrape
    url: https://www.goldenvoice.com/events/
    priority: 1
    status: active
    notes: AXS venues (Fonda, El Rey, Shrine, Novo...). AXS has no public API; scrape GV directly.

  - name: Eventbrite (LA browse)
    category: multi
    method: jsonld
    url: https://www.eventbrite.com/d/ca--los-angeles/events/
    priority: 2
    status: flaky
    notes: >
      Browse page DOES embed clean schema.org/Event JSON-LD (venue, geo, date, price) — verified
      2026-06-16 it surfaces on-profile events ("OVERDRIVE: Hard Techno", afrobeats, "Sunset
      Sessions"). BUT an anti-bot wall blocks automated fetches after the first hit (urllib 405;
      curl gets challenged after a couple requests). Reliable only via a real browser session or a
      proper Eventbrite integration. High noise otherwise — filter hard. Don't sink time evading
      the bot wall; revisit with an authed/headless path.

  - name: Hollywood Pantages / Broadway in Hollywood
    category: theater
    method: jsonld
    url: https://www.broadwayinhollywood.com/events
    priority: 2
    status: active
    notes: Also surfaces via Ticketmaster API; direct page has season info earlier.

  - name: Center Theatre Group (Ahmanson/Taper/Douglas)
    category: theater
    method: scrape
    url: https://www.centertheatregroup.org/tickets/
    priority: 3
    status: candidate

  - name: Vidiots (Eagle Rock)
    category: film
    method: api
    url: https://vidiotsfoundation.org/wp-json/nj/v1/showtime
    priority: 1
    status: active
    notes: >
      Filmbot/Nightjar cinema (theater_id 249). The /coming-soon page is JS-rendered, but the
      widget is backed by a clean REST API: /wp-json/nj/v1/showtime/listings (films) +
      /showtime?per_page=100 (individual screenings w/ _datetime, _sold_out, series, ticket link).
      scripts/fetch_filmbot.py --site https://vidiotsfoundation.org. Verified 2026-06-16: ~20
      films / ~28 showtimes /2wk with runtime/year/sold-out. Generalizes to ANY nj/v1 cinema.

  - name: Brain Dead Studios
    category: film
    method: scrape
    url: https://studios.wearebraindead.com/
    priority: 1
    status: active

  - name: American Cinematheque (Egyptian/Aero/Los Feliz 3)
    category: film
    method: scrape
    url: https://www.americancinematheque.com/now-showing/
    priority: 1
    status: flaky
    notes: >
      No wp-json / no nj/v1 API exposed (verified 2026-06-16) — different stack, JS-rendered.
      Needs a true headless render or an undiscovered feed. Los Feliz 3 is walkable-ish from
      Silver Lake, so worth revisiting. High taste category.

  - name: New Beverly Cinema
    category: film
    method: scrape
    url: https://thenewbev.com/schedule/
    priority: 2
    status: flaky
    notes: >
      WordPress but schedule is powered by Veezi (Vista ticketing) and rendered client-side —
      no showtime post type in wp/v2, no static listings (verified 2026-06-16). Veezi has a
      web-service API but it's per-cinema token-gated (not public). Needs that token or a
      headless render. 35mm always; monthly calendar drops sell fast — flag on-sale dates.

  - name: Vista Theater
