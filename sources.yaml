      Official LA tourism board's weekend roundup. Blocks plain curl (403 "old-browser"), but the
      WebFetch tool reads it fine (verified 2026-06-16). Use it two ways at digest time: (1) editorial
      boost signal on catalog events, and (2) source of GENERAL LA context for the "Around town"
