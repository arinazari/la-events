    url: https://lodgeroomhlp.com/
    priority: 2
    status: flaky
    notes: JS-rendered; no static JSON-LD (verified 2026-06-16). Also appears via TM/RA — lean on those.

  - name: Zebulon (Frogtown)
    category: live_music
    method: scrape
    url: https://zebulon.la/
    priority: 1
    status: active
    notes: Experimental/electronic-adjacent bookings; very on-profile, close to home.

  - name: 2220 Arts + Archives
    category: live_music
