# LA Events — Source Registry
# ---------------------------------------------------------------------------
# Schema per source:
#   name:      display name
#   category:  electronic | live_music | comedy | film | theater | editorial |
#              general | beer_food | multi
#   method:    api | graphql | jsonld | scrape | webfetch | eventbrite | dice | veezi | seetickets | squarespace | rss | ics | gmail | manual
#              (webfetch = read at digest time via the WebFetch tool; for bot-walled/JS pages)
#   url:       endpoint or calendar page (or IG handle for manual)
#   priority:  1 (always fetch) .. 3 (only on category-specific requests)
#   status:    active | candidate | manual | flaky | dead
#   notes:     anything operationally useful
#
# last_discovery: updated whenever Discover mode runs
# ---------------------------------------------------------------------------

last_discovery: 2026-06-25

sources:

  # ── Tier 1: structured pipelines ─────────────────────────────────────────
  - name: Ticketmaster Discovery API
    category: multi
    method: api
    url: https://app.ticketmaster.com/discovery/v2/events.json
    priority: 1
    status: active
    notes: >
      Free key, 5000 calls/day. dmaId=324 for LA. Covers TM, TicketWeb, Universe,
      FrontGate — incl. Pantages (Broadway in Hollywood). Use scripts/fetch_ticketmaster.py.

  - name: Resident Advisor (LA)
    category: electronic
    method: graphql
    url: https://ra.co/graphql
    priority: 1
    status: active
    notes: >
      Unofficial GraphQL. scripts/fetch_ra.py. Verify AREA_ID once (see script header).
      Late start times = afterhours flags. Catches most semi-public warehouse events.

  - name: 19hz (LA)
    category: electronic
    method: scrape
    url: https://19hz.info/eventlisting_LosAngeles.php
    priority: 1
    status: active
    notes: >
      Canonical grassroots LA dance calendar (clubs, warehouses, festivals). HTML tables,
      no JSON-LD. scripts/fetch_19hz.py. Verified 2026-06-16: ~200 events/2wk, ~half flagged
      afterhours, with price tiers (incl. early-bird) and organizer/promoter names — the
      organizer column is a goldmine for Discover mode. Best single electronic source.

  - name: DICE (LA venues)
    category: live_music
    method: dice
    url: https://dice.fm/venue/
    priority: 1
    status: active
    venues:   # DICE venue slugs — scripts/fetch_dice.py pulls each. Grow this in Discover.
      - zebulon-y8bv                       # Zebulon (Frogtown)
      - gold-diggers-n2mq                  # Gold Diggers (East Hollywood)
      - the-mint-5ggd                      # The Mint (Mid-City)
      - townhouse-venice-d8ve              # Del Monte Speakeasy / Townhouse (Venice)
      - the-virgil-39bl                    # The Virgil (East Hollywood)
      - 2220-arts--archives-bdyv           # 2220 Arts + Archives (Historic Filipinotown)
      - permanent-records-roadhouse-olyg   # Permanent Records Roadhouse (Cypress Park)
      - grand-star-jazz-club-6kx8          # Grand Star Jazz Club (Chinatown)
      - sid-the-cat-auditorium-2wr5m       # Sid The Cat Auditorium (South Pasadena) — indie dance/electropop (Discover 6/19; 18 ev/30d)
      - catch-one-e582                     # Catch One (Mid-City) — house/techno + queer nightlife (Discover 6/19; 7 ev/30d)
      - only-the-wild-ones-mxvwr           # Only The Wild Ones (Venice) — hi-fi/vinyl listening bar, occasional DJ nights (Discover 6/19)
      # - the-silverlake-lounge-wb2v       # Silverlake Lounge — slug returned 0, re-verify
    notes: >
      THE unlock for the eastside/indie live-music lane. /browse is JS-rendered (0 events via
      static JSON-LD), BUT each dice.fm/venue/<slug> page embeds the full schema.org MusicEvent
      array under a Place's "event" key in static HTML (name, startDate, performers, price,
      ticket URL). MANDATORY: a real Chrome User-Agent — DICE 403s the default urllib agent.
      scripts/fetch_dice.py (verified 2026-06-16: 112 events across 9 venues, incl. Zebulon's
      "Mama's Gun" 6/17). Some shows also hit RA/TM — dedupe expected.

