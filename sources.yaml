  - name: Posh (posh.vip)
    category: multi
    method: api
    url: https://posh.vip/api/web/v2/trpc/events.fetchMarketplaceEvents
    priority: 1
    status: active
    notes: >
      Nightlife/party platform, strong LA afterhours + warehouse coverage (incl. TBA
      "revealed after RSVP" locations) and the promoter on every event. Authenticated tRPC API:
      scripts/fetch_posh.py replicates the logged-in explore search (sort=Trending,
      when=Today|This Week|This Month|Right Now, location preset LA). AUTH: needs POSH_TOKEN
      env var = a Posh session JWT (~30-day lifespan). Capture from a logged-in browser's
      network tab (events.fetchMarketplaceEvents request → x-jwt-token header). When it 401s,
      it's expired — re-capture and update POSH_TOKEN. Broad feed (some watch-party/webinar
      noise) — lean on taste.yaml ranking. Overlaps RA/19hz on afterhours — dedupe expected.

  # ── Verified-this-session reality check (2026-06-16) ─────────────────────
  # Static JSON-LD scraping (scripts/fetch_jsonld.py) covers FAR fewer LA sources than the
  # registry's method:jsonld tags assumed. Confirmed returning 0 events via static fetch:
  # DICE, Lodge Room, Pantages/Broadway-in-Hollywood, Vidiots (Filmbot), Zebulon, 2220 Arts.
  # These are JS-rendered and need either each site's underlying API or a headless-render
  # helper (proposed Phase-2 work). fetch_jsonld.py itself is correct and works on any source
  # that serves Event JSON-LD server-side; it just has few current targets. 19hz (table parser)
  # and the RA/TM APIs remain the reliable structured backbone.
