  # ── Tier 3: venues & promoters (JSON-LD / scrape) ────────────────────────
  - name: Goldenvoice
    category: live_music
    method: api
    url: https://aegwebprod.blob.core.windows.net/json/events/19/events.json
    priority: 1
    status: active
    notes: >
      AEG/AXS venues (Fonda, El Rey, The Roxy, The Novo, Shrine, Greek, Belasco). The /shows page
      is client-rendered, but events hydrate from a public Azure-blob JSON feed (site_id 19) — no
      bot wall. scripts/fetch_goldenvoice.py. Feed is statewide (Bay Area / SD / SB included); the
      fetcher filters to LA-metro venue cities. Rich fields: headliners/support, price low/high,
      on-sale + presale dates, age, tz-aware datetimes. Verified 2026-06-16 (~30 LA shows/2wk).
      Many LA shows also appear via TM API — dedupe expected.

  - name: Eventbrite (curated organizers)
    category: multi
    method: eventbrite
    url: https://www.eventbrite.com/
    priority: 2
    status: active
    organizers:
      - https://www.eventbrite.com/o/the-illusion-night-35936566313   # The Illusion Night
      - https://www.eventbrite.com/o/momentus-la-11979041397   # Momentus LA
      - https://www.eventbrite.com/o/set-underground-29866861729   # SET UNDERGROUND
      - https://www.eventbrite.com/o/level-8-dtla-72910363773   # Level 8, DTLA
      - https://www.eventbrite.com/o/blakcircle-108339115091   # Blakcircle
      - https://www.eventbrite.com/o/afrobeats-takeover-17508767406   # AFROBEATS TAKEOVER
      - https://www.eventbrite.com/o/we-love-kandy-tour-11369190113   # hard techno / rave promoter
    notes: >
      Open browse (/d/...) is behind an AWS WAF CAPTCHA — not scrapeable; public search API is
      retired. WORKAROUND (verified 2026-06-16): individual event + organizer pages are NOT walled
      and embed schema.org Event JSON-LD. scripts/fetch_eventbrite.py crawls the curated `organizers`
      list above (organizer page -> event links -> event JSON-LD) and also takes one-off --event URLs
      for flyer/link capture.
      KEEP THIS LIST GROWING (the coverage mechanism):
        - from a text blast / flyer link:  fetch_eventbrite.py --harvest <event_url>
        - opportunistically from the catalog (19hz/RA carry EB ticket links):
              fetch_eventbrite.py --scan-catalog   (run every Discover pass)
      Both extract the event's *own* organizer from JSON-LD and append it here, deduped.
      FUTURE: retry open browse discovery if the AWS WAF CAPTCHA is ever lifted, or via a
      headless/authed path — would replace the need to hand-curate organizers.

