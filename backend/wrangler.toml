# Cloudflare Worker config for the la-events concierge backend.
# Deploy:  cd backend && npm i && npx wrangler deploy
# Secrets: npx wrangler secret put ANTHROPIC_API_KEY
#          npx wrangler secret put CONCIERGE_TOKEN     (optional shared token — recommended)
#          npx wrangler secret put GITHUB_TOKEN        (optional — taste self-edit + Spotify rebuild kick)
# Per-profile Spotify (optional — adds the music layer per friend):
#          npx wrangler kv namespace create SPOTIFY_KV   # paste the id below
#          npx wrangler secret put SPOTIFY_CLIENT_ID     # from developer.spotify.com
#          npx wrangler secret put SPOTIFY_CLIENT_SECRET
#          npx wrangler secret put SPOTIFY_SYNC_TOKEN    # strong; the routine/CI present it to /spotify/fetch
#          npx wrangler secret put STATE_SECRET          # any long random string (signs the OAuth state)

name = "la-events-concierge"
main = "concierge-worker.js"
compatibility_date = "2024-11-01"

# Per-profile Spotify refresh-token store (keyed by feed hash). Create it once (command above) and
# paste the returned id. Leave this block out and the /spotify/* routes return 501 (chat still works).
[[kv_namespaces]]
binding = "SPOTIFY_KV"
id = "b42b9da0f2d54d63b753ed4e12864d85"

# Non-secret vars (override the in-code defaults). Secrets go via `wrangler secret put`.
[vars]
ANTHROPIC_MODEL = "claude-sonnet-4-6"   # executor (does the bulk of generation)
ADVISOR_MODEL = "claude-opus-4-8"        # advisor the executor consults for planning ("" disables; must be >= executor)
EFFORT = "max"                            # executor effort: low | medium | high | max
MAX_TOKENS = "8000"                       # output cap (leave room for adaptive thinking; raise if plans truncate)
DATA_URL = "https://arinazari.github.io/la-events/data.json"
ALLOWED_ORIGIN = "https://arinazari.github.io"
GITHUB_REPO = "arinazari/la-events"
GITHUB_BRANCH = "main"
PROFILE_SALT = "la-events/v1:"
# Spotify (per-profile music layer). The redirect URI must EXACTLY match one registered in your
# Spotify app at developer.spotify.com. Replace <you> with your workers.dev subdomain.
SPOTIFY_REDIRECT_URI = "https://la-events-concierge.arinazari.workers.dev/spotify/callback"
PAGE_URL = "https://arinazari.github.io/la-events/"   # where the "back to la-events" link points
