# profile.yaml — MECHANISM overrides for Justin's feed (username: justin).
# taste.yaml = CONTENT (what they like); this = MECHANISM (home + scoring dials). Only the knobs
# that differ need to live here — anything absent falls back to the repo defaults.
#
# Justin lives in Atwater Village (married to Kohar, username: kohar — same home), so geo is the only
# override. The code default is Ari's Silver Lake radius, which mostly overlaps; this re-centers
# it on Atwater and pulls in Glendale / Burbank, dropping the Westlake / Filipinotown edge.

home:
  neighborhood: Atwater Village
  coords: [ 34.1187, -118.2606 ] # geo.py's Atwater centroid; drives night-planner travel times

scoring:
  # Walkable / short drive from Atwater (+1), out to ~5 mi. Matched case-insensitively against each
  # event's neighborhood (whole name, not substring).
  near_home_neighborhoods:
    - atwater village
    - atwater
    - frogtown
    - elysian valley
    - silver lake
    - silverlake
    - los feliz
    - echo park
    - east hollywood
    - virgil village
    - glendale
    - burbank
    - glassell park
    - cypress park
    - mount washington
    - eagle rock
    - highland park
    - lincoln heights
    - chinatown
    - downtown
    - dtla
    - arts district
