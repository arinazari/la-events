# profile.yaml — MECHANISM config for Sevag's dashboard feed (username: sevag).
# Copied from Lori's (profiles/lori/profile.yaml) — same band/live-music weighting — with the
# geo retuned for Sherman Oaks (the Valley) instead of Glendale. taste.yaml = CONTENT; this = MECHANISM.

city: Los Angeles
timezone: America/Los_Angeles

# Home base — Sherman Oaks (drives the "close to home" boost + night-planner travel times).
home:
  neighborhood: Sherman Oaks
  coords: [34.1510, -118.4490]   # geo.py's Sherman Oaks centroid; used by scripts/lib/geo.py

sources:
  ticketmaster_dma_id: "324"   # LA DMA
  ra_area_id: 23               # RA's LA area number

scoring:
  # Band/live-music-forward. Live music is the top lane; electronic is welcome but secondary
  # (Lori's taste: "more into bands than electronic", not anti-electronic). Pop is a real lane
  # (Olivia Rodrigo); art bumped for the ethnomusicologist's cultural appetite.
  category_weights:
    music: 3          # live music (catalog's term) — the spine
    live_music: 3
    pop: 2            # craft pop (Olivia Rodrigo tier)
    film: 2           # rep & arthouse cinema
    theater: 2
    beer_food: 2
    art: 2            # cultural / heritage / museum programming
    electronic: 2     # secondary, not unwelcome — a good DJ/live-electronic act still counts
    party: 1          # club / warehouse / afterhours — not the scene
    comedy: 1
    general: 1

  rating_thresholds:
    - [8, 5]
    - [6, 4]
    - [4, 3]
    - [2, 2]

  # Walkable / short drive from Sherman Oaks (+1). Valley-centric radius, plus the over-the-hill
  # spots a short 101/405 hop away (Hollywood, WeHo, Brentwood/Westwood via the pass).
  near_home_neighborhoods:
    - sherman oaks
    - studio city
    - encino
    - van nuys
    - valley village
    - north hollywood
    - noho
    - noho arts district
    - toluca lake
    - burbank
    - universal city
    - tarzana
    - reseda
    - lake balboa
    - glendale
    - hollywood
    - west hollywood
    - weho
    - laurel canyon
    - bel air
    - brentwood
    - westwood

  # +1: setting boost retuned for a band-head — rewards intimate / analog / outdoor rooms,
  # NOT afterhours DJ parties. (Dropped "groove"/"disco"/"all night" etc., which were inflating
  # electronic afters — "groove" even substring-matched "Groovers Inn".)
  groove_terms:
    - vinyl
    - all-analog
    - all analog
    - listening
    - record store
    - in-store
    - rooftop
    - sunset
    - golden hour
    - open-air
    - open air
    - outdoor
    - garden
    - patio

  # European house-label boost is electronic-scene specific and largely irrelevant to her;
  # kept inert (a token that won't match) so the engine doesn't fall back to Ari's label list.
  eu_terms:
    - __no_eu_boost__

  # -2 each. Pared down from Ari's list: NO hip-hop / dubstep / hardstyle / EDM-genre penalties
  # (a diverse, knowledgeable music head — genre breadth is the point). Kept: the genuinely
  # off-taste stuff (bottle-service clubs, generic no-billing Top-40 nights, tribute/cover/decade
  # nostalgia) and the non-music junk.
  penalty_terms:
    - bottle service
    - bottle-service
    - vip table
    - table service
    - top 40
    - top-40
    - open format
    - open-format
    - tribute
    - cover band
    - watch party
    - world cup
    - fifa
    - sports bar
    - trivia
    - bingo
    - karaoke
    - networking
    - webinar
    - virtual
    - zoom

  # -2: far-flung from Sherman Oaks (not worth the trip by default).
  far_terms:
    - anaheim
    - santa ana
    - irvine
    - san diego
    - temecula
    - ventura
    - riverside
    - long beach
    - costa mesa
    - huntington beach

  # Spotify + feedback music layer (Phase C) — same mechanics as root; inert until Sevag has a
  # Spotify artifact / feedback log of his own. Enriches taste.yaml, never overwrites it.
  spotify:
    tier_points:
      core: 3
      strong: 2
      light: 1
      hidden: -3
    artist_cap: 5
    genre_points: 1
    genre_threshold: 0.5
    genre_cap: 1
    min_name_len: 3
    ambiguous_names: [train, future, juice, jungle, lights, justice, work, sanctuary, paradise,
                      chance, hold, alive]

  feedback:
    weights:
      loved: 2.0
      went: 1.5
      clicked_ticket: 0.5
      added_calendar: 0.5
      skipped: -0.5
      hide: -10.0

# Travel / geography for the night-planner (scripts/lib/geo.py) — same tunables as root.
geo:
  travel:
    walk_max_miles: 0.8
    walk_min_per_mile: 20.0
    drive_floor_min: 8
    park_buffer_min: 6
    short_min_per_mile: 4.0
    long_min_per_mile: 2.4
    short_threshold_miles: 4
