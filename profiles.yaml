# profiles.yaml — per-person taste configs for the dashboard's profile switcher.
#
# This is a friends-tool convenience layer, NOT real security. Each profile gets its own
# taste.yaml (+ optional profile.yaml) and its own scored feed at dashboard/data.<hash>.json,
# where <hash> = first 16 hex of sha256("la-events/v1:" + lowercased(username)). The username
# is the access key ("like a password"): it's typed into the dashboard's "prof" popup, hashed
# in the browser, and used to fetch that feed. Anyone who knows a username can load that profile
# (and the feed file is publicly served), so pick non-obvious usernames. See ROADMAP "Profiles".
#
# The DEFAULT (logged-out) feed is the repo-root taste.yaml / profile.yaml -> dashboard/data.json.
# An `owner: true` profile (Ari's own login) also points at the root taste.yaml: logging in just
# unlocks the concierge/LLM + lets the owner self-edit the *canonical* taste (the digest + default
# feed reflect it). Friends get their own profiles/<name>/taste.yaml and can only edit that.
#
# After editing, rebuild the feeds:   python scripts/build_profiles.py
# (or just one:                        python scripts/build_profiles.py --only <username>)
#
# Per-profile Spotify (the music layer): each profile scores against ITS OWN Spotify + reactions
# (data/spotify/<hash>.json + data/feedback.<hash>.jsonl), not Ari's. Friends connect Spotify in the
# dashboard (the profile popup) via the concierge Worker; build_profiles.py passes each profile's hash
# so the feed re-ranks to their listening. Nothing to add here — see backend/README.md "Per-profile Spotify".
#
# Group planning (NOT private — Ari's call): the concierge can read ANY profile here and combine tastes
# to "find events together" (scripts/group_picks.py --people me,<friends>). Knowing the username is
# permission enough; there's deliberately no per-profile "private" flag. Pick non-obvious usernames if
# that matters to a friend — the access model is obfuscation, not security (same as the feed files).
#
# Per-profile digest FORMAT (optional `digest_prefs:` on an entry): HOW that person's digest reads
# (length/sections/group_by/tone) — a path to a YAML like digest.yaml; defaults to
# profiles/<username>/digest.yaml. Presentation only (ranking lives in taste/profile). The concierge
# edits it ("make my digest shorter", "drop the radar"); build_profiles.py injects it into the feed.

salt: "la-events/v1:"        # mixed into the filename hash; shared verbatim with the page. Public by nature.

profiles:
  - username: demo           # EXAMPLE — replace or delete. (Guessable on purpose; real ones shouldn't be.)
    name: Demo (indie + jazz)
    taste: profiles/demo/taste.yaml
    # profile: profile.yaml    # optional; omit to inherit the root profile.yaml (geo + scoring mechanics)
    # digest: digests/<hash>   # optional; per-profile digest dir staged by the deploy workflow (follow-up)
    # digest_prefs: profiles/demo/digest.yaml  # optional; HOW the digest reads (defaults to this path)

  - username: ari            # Ari's own login -> unlocks the concierge/LLM on the default feed.
    name: Ari                #   RENAME this to something non-obvious: as owner it can self-edit the
    taste: taste.yaml        #   canonical taste.yaml (which drives the digest + everyone's default feed).
    owner: true              #   owner -> edits the root taste.yaml (friends can't) + unlocks the
                             #   dashboard's admin settings (Refresh events / Discover sources).

  - username: vish           # friend profile (Dr. Ganesan). Username is the access key;
    name: Dr. Ganesan        #   renamed from the guessable dr_ganesan (2026-07).
    taste: profiles/vish/taste.yaml         # starter taste — edit it, then rebuild this profile.

  - username: lori           # friend profile. NOTE: username is the access key + is guessable here;
    name: Lori               #   swap it for something non-obvious before sharing the feed widely.
    taste: profiles/lori/taste.yaml         # band-forward, diverse ethnomusicologist taste.
    profile: profiles/lori/profile.yaml     # her own MECHANISM: Glendale geo + live-music weighting.

