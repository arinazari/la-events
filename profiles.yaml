# profiles.yaml — per-person taste configs for the dashboard's profile switcher.
#
# This is a friends-tool convenience layer, NOT real security. Each profile gets its own
# taste.yaml (+ optional profile.yaml) and its own scored feed at dashboard/data.<hash>.json,
# where <hash> = first 16 hex of sha256("la-events/v1:" + lowercased(username)). The username
# is the access key ("like a password"): it's typed into the dashboard's "prof" popup, hashed
# in the browser, and used to fetch that feed. Anyone who knows a username can load that profile
# (and the feed file is publicly served), so pick non-obvious usernames. See ROADMAP "Profiles".
#
# The DEFAULT profile is the repo-root taste.yaml / profile.yaml -> dashboard/data.json (Ari /
# the public feed); it is NOT listed here. List only the additional people below.
#
# After editing, rebuild the feeds:   python scripts/build_profiles.py
# (or just one:                        python scripts/build_profiles.py --only <username>)

salt: "la-events/v1:"        # mixed into the filename hash; shared verbatim with the page. Public by nature.

profiles:
  - username: demo           # EXAMPLE — replace or delete. (Guessable on purpose; real ones shouldn't be.)
    name: Demo (indie + jazz)
    taste: profiles/demo/taste.yaml
    # profile: profile.yaml    # optional; omit to inherit the root profile.yaml (geo + scoring mechanics)
    # digest: digests/<hash>   # optional; per-profile digest dir staged by the deploy workflow (follow-up)
