# LA Dining — Source Registry
# ---------------------------------------------------------------------------
# Sibling of sources.yaml (events). Same schema, dining-specific vocab.
#
# Schema per source:
#   name:      display name
#   category:  editorial | guide | reservations | popup | general
#   method:    api | jsonld | scrape | rss | manual
#   url:       endpoint or page (or IG handle for manual)
#   priority:  1 (always fetch) .. 3 (only on category/occasion-specific requests)
#   status:    active | candidate | manual | flaky | dead
#   notes:     anything operationally useful
#   harvest:   (optional) front-page / index / roundup URLs to SCAN every run for
#              current "hot / new / trending" listicles. Open the roundup articles
#              and harvest every restaurant named as a signal — these curated lists
#              are the primary signal, not just standalone deep reviews.
#
# last_discovery: updated whenever Discover mode runs
#
# Operating principle: editorial/guide sources are SIGNALS that surface and rank
# restaurants; reservation sources answer "what's hot" (hot-lists) and "can I get
# in" (availability — checked only for shortlisted candidates, never bulk-scraped).
# Never scrape Instagram; IG-only operators are method: manual.
# ---------------------------------------------------------------------------

last_discovery: null

sources:

  # ── Editorial: critics & trending (the backbone of "what to consider") ────
  - name: Eater LA
    category: editorial
    method: rss
    url: https://la.eater.com/rss/index.xml
    priority: 1
    status: active
    notes: >
      RSS catches new posts, but the real signal is the roundup articles — scan
      the front page + Heatmap index every run. Strongest source for new openings.
    harvest:
      - https://la.eater.com/                # front page — current roundups/listicles
      - https://la.eater.com/maps            # Heatmaps: Hottest New, Where to Eat Right Now

  - name: The Infatuation — Los Angeles
    category: editorial
    method: scrape
    url: https://www.theinfatuation.com/los-angeles
    priority: 1
    status: active
    notes: >
      Best New Restaurants, the Hit List, and occasion/neighborhood guides
      (date night, dinner with parents, etc.). Great for occasion-based queries.
      The guides index is the goldmine — scan it for current roundups every run.
    harvest:
      - https://www.theinfatuation.com/los-angeles          # front page
      - https://www.theinfatuation.com/los-angeles/guides   # guides index: Hit List, Best New, occasion

  - name: LA Times — Food
    category: editorial
    method: scrape
    url: https://www.latimes.com/food
    priority: 1
    status: active
    notes: >
      Bill Addison reviews, the 101 Best Restaurants list, and front-page "best
      new / where to eat" roundups. Possible paywall friction — degrade gracefully.
      Badge entries as "(LAT 101)".
    harvest:
      - https://www.latimes.com/food                              # front page — roundups + reviews
      - https://www.latimes.com/projects/best-restaurants-la-101   # 101 Best Restaurants

  # ── Guide: prestige / special-occasion ───────────────────────────────────
  - name: Michelin Guide — Los Angeles
    category: guide
    method: scrape
    url: https://guide.michelin.com/us/en/california/us-los_angeles/restaurants
    priority: 2
    status: active
    notes: >
      Stars, Bib Gourmand (great value), and Green stars (sustainability). Use
      for "somewhere special" occasions. Badge as "(★)", "(Bib Gourmand)". Also
      scan the editorial "Magazine" articles for new-addition / where-to-eat roundups.
    harvest:
      - https://guide.michelin.com/us/en/california/us-los_angeles/restaurants  # LA listing: stars/bib
      - https://guide.michelin.com/us/en/article                                # Michelin editorial roundups

  # ── Reservations: hot-lists + availability ───────────────────────────────
  - name: Resy — Los Angeles
    category: reservations
    method: scrape
    url: https://resy.com/cities/la
    priority: 1
    status: active
    notes: >
      Two roles. (1) EDITORIAL: the Hit List + Resy's "Right This Way" blog run
      LA "where to eat now / best new" roundups — harvest these as trending signals
      in Step 1. (2) AVAILABILITY: Notify/booking answers "can I get in" — checked
      only for shortlisted candidates with a concrete date/time, never bulk-scraped.
      No clean public API — web-fetch public pages politely.
    harvest:
      - https://resy.com/cities/la           # Resy Hit List (curated buzzy spots)
      - https://blog.resy.com/category/los-angeles/   # "Right This Way" LA roundups/reviews

  - name: OpenTable — Los Angeles
    category: reservations
    method: scrape
    url: https://www.opentable.com/los-angeles-restaurants
    priority: 2
    status: active
    notes: >
      Two roles, like Resy. (1) EDITORIAL: OpenTable's curated "best of / trending /
      hot" lists + blog — harvest in Step 1. (2) AVAILABILITY: broad coverage of
      larger/older/Westside rooms + last-minute tables, checked per-candidate only.
      Public affiliate API effectively dead — web-fetch browse/list pages.
    harvest:
      - https://www.opentable.com/los-angeles-restaurants   # trending / curated LA lists
      - https://www.opentable.com/blog/                     # OpenTable editorial roundups

  # ── Manual-capture (IG / SMS — never scraped) ────────────────────────────
  - name: Popup & food-truck IG/SMS lists
    category: popup
    method: manual
    url: (rolling — add handles as discovered)
    priority: 1
    status: manual
    notes: >
      Popups and trucks are date/location-bound and often IG-only. Capture path:
      screenshot flyer/story -> /la-dining capture, or join the operator's email/SMS
      list. Discover mode should keep proposing new operator handles. Preserve
      "location drops day-of" exactly.

  # ── Candidates queue (vet in Discover mode) ──────────────────────────────
  - name: Tock (LA)
    category: reservations
    method: scrape
    url: https://www.exploretock.com/city/los-angeles
    priority: 3
    status: candidate
    notes: >
      Reservation platform skewed toward tasting menus, ticketed dinners, and
      popups — useful for "special occasion" and popup booking. Vet on first run.
